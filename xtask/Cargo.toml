[package]
name = "xtask"
description = "GroupKeep developer tasks: the release folder and the Windows installer."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# SHA256SUMS.txt beside the setup (MoneyKeep Launcher checks downloads against it).
sha2 = "0.10"
# THIRD-PARTY-LICENSES.txt is made from `cargo metadata`'s JSON (security-review-1 M8).
serde_json = "1"
