[package]
name = "groupkeep"
description = "GroupKeep — divide group expenses (MoneyKeep family)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "groupkeep_app"
path = "src/lib.rs"

[[bin]]
name = "groupkeep"
path = "src/main.rs"

[dependencies]
groupkeep-core = { path = "../core" }
slint = "1.18"
rfd = "0.17"

[build-dependencies]
slint-build = "1.18"

# The Windows version resource (and the icon, once assets/icon.ico exists), as in CalcKeep.
[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
