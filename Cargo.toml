[workspace]
resolver = "2"
# xtask: developer tasks (cargo xtask release / installer), as in CalcKeep and MoneyKeep
members = ["core", "app", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MoneyKeep Project contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/moneykeepproject/groupkeep"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
